name: CI

# The repo's guarantees (AGENTS.md: never claim it works without testing) rest
# on suites that were run manually until now. These are exactly the locally
# green commands — no deploy, no secrets (LAN-only product, nothing to leak).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # One product version (VERSION at the root): the receiver's copies must match it.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/versioning/check_version.sh

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17 # the build's JVM target (build.gradle.kts)
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest --console=plain

  # ADR-038 S0: the receiver builds on Windows and its unit tests pass there
  # (window, decoder and stay-awake are stubs until W1). The Mac build is
  # checked locally: CI has no macOS job yet.
  desktop-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop-native/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-native/src-tauri
      - run: cargo build --locked
      - run: cargo test --locked --lib
