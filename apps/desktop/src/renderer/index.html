<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Zero-Friction Local Cast</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'"
    />
    <link rel="stylesheet" href="./src/renderer.css" />
  </head>
  <body>
    <main class="stage">
      <h1 class="title">Zero-Friction Local Cast</h1>
      <p class="status" id="status">Waiting for mobile device…</p>
      <div class="qr-card" id="qr-card" hidden>
        <img id="qr" alt="Pairing QR code" />
      </div>
      <p class="error" id="error" hidden></p>
      <!-- The cast surface (Phase5): the remote MediaStream lands here; the
           element is composited directly, no canvas copy (desktop.md).
           NOT muted — since Phase7 the stream also carries the phone's game
           audio, and it plays through this element (Phase9 adds per-stream
           volume via Web Audio). Electron's autoplay policy allows unmuted
           play(); a block would be logged by the sink's play().catch. -->
      <video class="video" id="video" hidden autoplay playsinline></video>
      <!-- The mic pc's stream lands here (Phase8): a separate element from the
           <video> on purpose — the two audio tracks stay independent streams
           end to end (ADR-003), and Phase9's AudioMixer will split them into
           per-stream Web Audio graphs. NOT muted; autoplay policy as above. -->
      <audio id="mic-audio" hidden autoplay></audio>
      <p class="hint" id="hint">Scan with your Android device — the code is valid for 10 minutes and refreshes automatically</p>
      <button class="button" id="regenerate" type="button">New QR code</button>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
