<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Zero-Friction Local Cast</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'"
    />
    <link rel="stylesheet" href="./src/renderer.css" />
  </head>
  <body>
    <main class="stage">
      <h1 class="title">Zero-Friction Local Cast</h1>
      <p class="status" id="status">Waiting for mobile device…</p>
      <div class="qr-card" id="qr-card" hidden>
        <img id="qr" alt="Pairing QR code" />
      </div>
      <p class="error" id="error" hidden></p>
      <!-- The cast surface (Phase5): the remote MediaStream lands here; the
           element is composited directly, no canvas copy (desktop.md).
           Muted — since Phase9 the element renders video only; its audio
           track plays through the Web Audio mixer below, so leaving the
           element unmuted would play the game audio twice. The muted
           element also satisfies autoplay under any gesture policy. -->
      <video class="video" id="video" hidden autoplay playsinline muted></video>
      <!-- Phase9's mixer (audio.md): the receiver's one allowed audio control
           — independent volume/mute per stream (game audio, microphone).
           Shown only while receiving; levels persist across launches. -->
      <div class="mixer" id="mixer" hidden>
        <div class="mixer-channel">
          <label class="mixer-label" for="game-volume">Game audio</label>
          <input type="range" id="game-volume" min="0" max="100" step="1" />
          <button class="mixer-button" id="game-mute" type="button">Mute</button>
        </div>
        <div class="mixer-channel">
          <label class="mixer-label" for="mic-volume">Microphone</label>
          <input type="range" id="mic-volume" min="0" max="100" step="1" />
          <button class="mixer-button" id="mic-mute" type="button">Mute</button>
        </div>
      </div>
      <p class="hint" id="hint">Scan with your Android device — the code is valid for 10 minutes and refreshes automatically</p>
      <button class="button" id="regenerate" type="button">New QR code</button>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
