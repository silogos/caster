[package]
name = "desktop-native-spike"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"
qrcode = { version = "0.14", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
if-addrs = "0.13"
anyhow = "1"
str0m = "0.25"
