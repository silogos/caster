[package]
name = "desktop-native"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
base64 = "0.22"
rand = "0.8"
qrcode = { version = "0.14", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
if-addrs = "0.13"
objc2 = { version = "0.6", features = ["exception"] }
objc2-core-foundation = { version = "0.3", features = ["CFDictionary"] }
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-av-foundation = { version = "0.3", features = ["AVSampleBufferDisplayLayer"] }
objc2-core-media = { version = "0.3", features = ["CMSampleBuffer", "CMTime", "CMFormatDescription", "CMSync"] }
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVPixelBufferPool", "CVBuffer", "CVReturn"] }
cpal = "0.15"
anyhow = "1"
livekit = "0.10"

[lib]
name = "desktop_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
