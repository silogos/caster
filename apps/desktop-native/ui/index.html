<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zero-Friction Local Cast</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #0a0c10; color: #e6e8ee;
        font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
        overflow: hidden;
      }
      #app { width: 100%; height: 100%; position: relative; }
      .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }
      .stage.hidden { display: none; }
      .heading { font-size: 22px; font-weight: 600; margin-top: 24px; }
      .subline { font-size: 15px; color: #969ba6; margin-top: 8px; }
      .qr-card { background: #fff; padding: 14px; border-radius: 8px; margin-top: 16px; }
      .qr-card img { width: 260px; height: 260px; display: block; }
      .hint { font-size: 11px; color: #6e7480; margin-top: 10px; }
      /* receiving stage: the video fills the window (contain) */
      #video-stage { background: #000; }
      #stage-receiving { background: #000; }
      #video-frame {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        max-width: 100%; max-height: 100%;
        width: auto; height: auto;
      }
      #status-chip {
        position: absolute; top: 12px; left: 16px;
        background: rgba(10, 12, 16, 0.7); color: #e6e8ee;
        font-size: 13px; padding: 6px 10px; border-radius: 6px;
        display: none;
      }
      #app.receiving:hover #status-chip { display: block; }
      button {
        background: transparent; color: #e6e8ee; border: 1px solid #3a4150;
        border-radius: 8px; padding: 8px 16px; font-size: 13px; margin-top: 14px;
        cursor: pointer;
      }
      button.confirming { border-color: #d9534f; color: #ffb3b0; }
      /* Receiver controls: only receiver/environment settings live here
         (cast settings belong to the phone). Hidden until a phone connects. */
      #controls {
        position: absolute; left: 0; right: 0; bottom: 0;
        display: none; align-items: center; gap: 12px;
        padding: 10px 16px; background: rgba(10, 12, 16, 0.85);
        border-top: 1px solid #1f2430; font-size: 13px;
      }
      #app.connected #controls { display: flex; }
      #app.receiving #controls { opacity: 0; transition: opacity 0.2s; }
      #app.receiving:hover #controls { opacity: 1; }
      #controls button { margin-top: 0; padding: 6px 12px; }
      #controls .spacer { flex: 1; }
      #game-volume { width: 160px; }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- QR hero -->
      <div id="stage-waiting" class="stage">
        <div class="heading">Scan with your Android device</div>
        <div class="subline">Waiting for mobile device…</div>
        <div class="qr-card"><img id="qr-img" alt="pairing QR" /></div>
        <button id="new-qr" title="Invalidates this code and shows a new one">New QR code</button>
      </div>
      <!-- No input -->
      <div id="stage-no-input" class="stage hidden" style="justify-content: center;">
        <div class="heading">No input video</div>
        <div class="subline" id="no-input-subline"></div>
      </div>
      <!-- Receiving -->
      <div id="stage-receiving" class="stage hidden">
        <img id="video-frame" alt="cast" />
        <div id="status-chip"></div>
      </div>
      <!-- Receiver controls (phone connected) -->
      <div id="controls">
        <label for="game-volume">Game audio</label>
        <input id="game-volume" type="range" min="0" max="100" step="1" />
        <span id="game-volume-value"></span>
        <button id="game-mute">Mute</button>
        <span class="spacer"></span>
        <button id="disconnect" title="Ends the cast and forgets this phone">Disconnect</button>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
