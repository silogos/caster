<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile app — full UI prototype (broadcast console: scan-first, on-air home)</title>
<style>
  /* ─────────────────────────────────────────────────────────────────────
     BROADCAST-CONSOLE REDESIGN (v2)

     Identity: the phone is the tally/transport section of a broadcast
     chain (desktop = receiver, OBS = the studio). One accent — broadcast
     amber — plus neutral graphite. Status "lamps" (LEDs), silkscreen caps
     labels (hardware panel printing), tabular mono for data.

     TOKENS — port contract. After the port these move INTO
     ui/theme/Color.kt + Theme.kt (the prototype becomes the source of
     truth; v1 said the reverse). What changed vs v1 and why:
       • primary #A8C7FA → #F2A93B. The old value is stock Material 3
         dark primary (tone-80 of the default seed) — the "unmodified
         theme" anti-pattern. Amber = tally/REC lamps on broadcast gear;
         clearly distinct from the (pale pink) error color.
       • Neutrals unchanged (off-black graphite, not #000 — Rule 5).
     Port notes:
       • Type: Roboto 400/500/700 ONLY (stock Android has no 600; v1 used
         600). Data readouts (timer, profile specs) use tabular figures —
         Compose: FontFeature "tnum" or Roboto Mono.
       • Shapes (M3 mapping): cards 18→large 16, big button 16, controls
         10→medium 12, chips/torch stay pill/circle.
       • Icons: inline stroke SVGs here; port via Material Symbols
         Outlined 1.7-weight equivalents — settings, sports_esports, mic,
         headphones, warning, info, check_circle, chevron_left,
         expand_more, tune, flashlight, qr_code_2.
       • New strings needed: the hero splits "Connected to X"/"Casting to
         X" into an overline + name (add connected_overline/casting_overline
         or keep one string and style-what-exists); the live timer reads
         the cast start timestamp (CastState.Casting) — integration point,
         never faked.
     ───────────────────────────────────────────────────────────────────── */
  :root {
    --cast-primary: #F2A93B;
    --cast-on-primary: #1A1206; /* filled-surface text — the onPrimary pair */
    --cast-background: #101418;
    --cast-surface: #161B22;
    --cast-on: #E6EAF2;
    /* onSurfaceVariant ≈ --cast-on desaturated into the background. */
    --cast-on-variant: color-mix(in srgb, var(--cast-on) 62%, var(--cast-background));
    /* error: Material3 dark error tone — distinct in hue from the amber accent. */
    --cast-error: #F2B8B5;
    --line: color-mix(in srgb, var(--cast-on) 13%, var(--cast-surface));
    --chip-border: var(--line);
    --chip-selected-bg: color-mix(in srgb, var(--cast-primary) 15%, var(--cast-surface));
    --page-bg: color-mix(in srgb, var(--cast-background) 60%, #000);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page-bg);
    color: var(--cast-on);
    font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 40px;
    min-height: 100vh;
  }

  /* ---- Prototype-only state controls (never part of the ported UI) ---- */
  .proto-controls {
    width: 400px; max-width: 100%;
    padding: 10px 12px; margin-bottom: 16px;
    border: 1px dashed var(--chip-border); border-radius: 12px;
    font-size: 12px; color: var(--cast-on-variant);
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  .proto-controls .proto-label { flex: 0 0 auto; }
  .pbtn {
    font: inherit; font-size: 12px; color: var(--cast-on);
    background: transparent; border: 1px solid var(--chip-border);
    border-radius: 999px; padding: 2px 10px; cursor: pointer;
  }
  .pbtn[aria-pressed="true"] { background: var(--chip-selected-bg); border-color: var(--cast-primary); color: var(--cast-primary); }

  /* ---- Phone frame ---- */
  .phone {
    width: 400px; max-width: 100%;
    background: var(--cast-background);
    border: 1px solid var(--chip-border);
    border-radius: 28px;
    padding: 28px 20px 40px;
  }

  /* ---- Type roles ----
     Scale 22 / 20 / 17 / 15 / 14 / 13 / 11; Roboto-real weights only. */
  .hero-name { font-size: 22px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.2; }
  .screen-title { font-size: 20px; font-weight: 500; }
  .bar-title { font-size: 17px; font-weight: 500; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub-label { font-size: 13px; color: var(--cast-on-variant); margin-top: 12px; }
  .hint { font-size: 13px; color: var(--cast-on-variant); margin-top: 8px; line-height: 1.45; }

  /* Silkscreen: caps panel label above each card (hardware printing). */
  .silkscreen {
    font-size: 11px; font-weight: 500; letter-spacing: 0.10em; text-transform: uppercase;
    color: color-mix(in srgb, var(--cast-on-variant) 80%, var(--cast-on));
    margin-top: 20px; padding: 0 4px;
  }

  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ---- Status lamps (LEDs) ----
     Three semantic states, tiny 9px lamps — console annunciators. */
  .led {
    flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%;
    background: color-mix(in srgb, var(--cast-on) 45%, var(--cast-surface));
  }
  .led.on   { background: var(--cast-primary); box-shadow: 0 0 10px color-mix(in srgb, var(--cast-primary) 55%, transparent); }
  .led.hot  { background: var(--cast-error);   box-shadow: 0 0 10px color-mix(in srgb, var(--cast-error) 45%, transparent); }
  .led.pulse { animation: tally 2.4s ease-in-out infinite; }
  @keyframes tally {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }

  /* ---- Buttons ---- */
  .btn-go {
    width: 100%; display: flex; align-items: center; justify-content: center;
    min-height: 54px; border-radius: 16px;
    background: var(--cast-primary); color: var(--cast-on-primary);
    border: 1px solid var(--cast-primary);
    font: inherit; font-size: 15px; font-weight: 700; letter-spacing: 0.01em;
    cursor: pointer; margin-top: 16px;
  }
  .btn-go:active { filter: brightness(0.94); }
  .btn-stop {
    width: 100%; display: flex; align-items: center; justify-content: center;
    min-height: 54px; border-radius: 16px;
    background: transparent; color: var(--cast-on);
    border: 1px solid color-mix(in srgb, var(--cast-on) 30%, var(--cast-surface));
    font: inherit; font-size: 15px; font-weight: 500;
    cursor: pointer; margin-top: 16px;
  }
  .btn-stop:active { background: color-mix(in srgb, var(--cast-on) 6%, transparent); }
  .btn-mid {
    font: inherit; font-size: 14px; font-weight: 500;
    border-radius: 12px; padding: 11px 18px; cursor: pointer;
    background: var(--cast-primary); color: var(--cast-on-primary);
    border: 1px solid var(--cast-primary);
  }
  .text-btn {
    font: inherit; font-size: 14px; font-weight: 500;
    background: none; border: none; padding: 8px;
    color: var(--cast-primary); cursor: pointer;
  }
  .text-btn.quiet { color: color-mix(in srgb, var(--cast-on-variant) 60%, var(--cast-on)); }
  .icon-btn {
    flex: 0 0 auto; width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid var(--chip-border); border-radius: 12px;
    color: var(--cast-on); cursor: pointer;
  }
  .icon-btn:active { background: color-mix(in srgb, var(--cast-on) 6%, transparent); }

  /* ---- Status rows: icon + message, one treatment on every screen ---- */
  .status-row { display: flex; align-items: flex-start; gap: 8px; margin-top: 10px; font-size: 14px; line-height: 1.45; }
  .status-row svg { flex: 0 0 auto; margin-top: 1px; }
  .status-row.error { color: var(--cast-error); }
  .status-row.info { color: var(--cast-on); }
  .status-row.ok { color: var(--cast-primary); }

  /* ---- Spinner ---- */
  .spinner {
    width: 16px; height: 16px; flex: 0 0 auto;
    border: 2px solid var(--chip-border); border-top-color: var(--cast-primary);
    border-radius: 50%; animation: spin 0.9s linear infinite;
  }
  .spinner-lg { width: 28px; height: 28px; border-width: 3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 14px; }

  /* ---- App bar (Home / Settings) ---- */
  .app-bar { display: flex; align-items: center; gap: 10px; margin-top: 4px; min-height: 40px; }
  .bar-sub { font-size: 13px; color: var(--cast-on-variant); margin-top: 6px; line-height: 1.45; }

  /* ---- On-air hero: tally + desktop name (+ live timer) ---- */
  .hero { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
  .hero-left { flex: 1 1 auto; min-width: 0; }
  .hero-overline {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 500; letter-spacing: 0.10em; text-transform: uppercase;
    color: var(--cast-on-variant);
  }
  .hero-name { margin-top: 6px; overflow-wrap: break-word; }
  .hero-meta { margin-top: 10px; font-size: 13px; color: var(--cast-on-variant); }

  /* ---- Grouped cards (inset lists) ---- */
  .card {
    background: var(--cast-surface);
    border: 1px solid var(--chip-border);
    border-radius: 18px;
    margin-top: 8px;
    overflow: hidden;
  }
  .card-foot { font-size: 13px; color: var(--cast-on-variant); padding: 10px 16px 12px; line-height: 1.45; border-top: 1px solid var(--chip-border); }

  /* ---- Icon list rows ---- */
  .icon-row { display: flex; align-items: center; gap: 14px; padding: 13px 16px; }
  .icon-row + .icon-row { border-top: 1px solid var(--chip-border); }
  .row-ico {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: var(--cast-on);
    background: color-mix(in srgb, var(--cast-on) 8%, var(--cast-surface));
  }
  .row-text { flex: 1 1 auto; min-width: 0; }
  .row-title { font-size: 15px; font-weight: 500; line-height: 1.35; }
  .row-sub { font-size: 13px; color: var(--cast-on-variant); line-height: 1.45; margin-top: 2px; }
  .row-title.err, .row-sub.err { color: var(--cast-error); }
  .row-ico.err { color: var(--cast-error); background: color-mix(in srgb, var(--cast-error) 10%, var(--cast-surface)); }
  .row-right { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; }

  /* ---- LED rows (This cast): lamp + plain words ---- */
  .led-row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 16px; font-size: 14px; line-height: 1.45;
  }
  .led-row + .led-row, .led-row + .icon-row, .icon-row + .led-row { border-top: 1px solid var(--chip-border); }
  .led-row .led { margin-top: 5px; }
  .led-row .row-right { align-self: center; }
  .led-row.hot { color: var(--cast-error); }

  /* ---- Segmented control (short option sets: resolution, fps) ---- */
  .seg { display: flex; border: 1px solid var(--chip-border); border-radius: 12px; overflow: hidden; margin: 8px 16px 0; }
  .seg-btn {
    flex: 1 1 0; font: inherit; font-size: 14px; color: var(--cast-on);
    background: transparent; border: none; cursor: pointer;
    padding: 10px 0; text-align: center;
  }
  .seg-btn + .seg-btn { border-left: 1px solid var(--chip-border); }
  .seg-btn[aria-pressed="true"] { background: var(--chip-selected-bg); color: var(--cast-primary); font-weight: 500; }
  .seg-label { font-size: 13px; color: var(--cast-on-variant); margin-top: 14px; padding: 0 16px; }

  /* ---- Profile selector rows (radio + name + intent + real spec) ---- */
  .pick-row { display: flex; align-items: center; gap: 14px; padding: 12px 16px; cursor: pointer; }
  .pick-row + .pick-row { border-top: 1px solid var(--chip-border); }
  .pick-row.pick-on { background: color-mix(in srgb, var(--cast-primary) 7%, var(--cast-surface)); }
  .pick-radio {
    flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid color-mix(in srgb, var(--cast-on) 30%, transparent);
    display: flex; align-items: center; justify-content: center;
  }
  .pick-row.pick-on .pick-radio { border-color: var(--cast-primary); }
  .pick-row.pick-on .pick-radio::after {
    content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--cast-primary);
  }
  .pick-spec { font-size: 11px; color: var(--cast-on-variant); margin-top: 3px; letter-spacing: 0.02em; }

  /* ---- Mic device picker (Home's Audio card): chips under the mic row,
     shown only while the mic is on — picking reroutes the LIVE record
     (AudioRecord.setPreferredDevice on the active twin, no rebuild). ---- */
  .mic-sub { padding: 4px 16px 14px; border-top: 1px solid var(--chip-border); }
  .mic-live { font-size: 13px; color: var(--cast-on); }

  /* ---- Advanced card body (below its header row) ---- */
  .adv-body {
    padding: 4px 16px 14px;
    border-top: 1px solid var(--chip-border);
  }

  /* ---- QR scanner (full-bleed) ---- */
  .scan-full {
    /* Breaks out of the phone frame padding: the scanner IS the screen. */
    margin: -28px -20px -40px;
    height: 660px; border-radius: 28px; overflow: hidden;
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    /* Placeholder for the camera feed — the app shows the live preview here. */
    background: color-mix(in srgb, var(--cast-background) 45%, #000);
  }
  .scan-title {
    position: absolute; top: 22px; left: 0; right: 0;
    text-align: center; font-size: 16px; font-weight: 500; color: var(--cast-on);
  }
  .scan-stage { position: relative; width: 252px; height: 252px; }
  .scan-cutout {
    position: absolute; inset: 0; border-radius: 26px;
    /* Everything except the cutout is dimmed (scrim-with-hole;
       Compose port: a scrim drawn with a rounded-rect hole / BlendMode.Clear). */
    box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.55);
  }
  .scan-placeholder {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--cast-on-variant); font-size: 12px;
  }
  .scan-line {
    position: absolute; left: 12px; right: 12px; top: 10px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--cast-primary), transparent);
    box-shadow: 0 0 12px 2px color-mix(in srgb, var(--cast-primary) 55%, transparent);
    animation: scan-sweep 2.4s ease-in-out infinite alternate;
  }
  @keyframes scan-sweep { from { transform: translateY(0); } to { transform: translateY(228px); } }
  .scan-c { position: absolute; width: 26px; height: 26px; border: 3px solid var(--cast-on); }
  .scan-c.tl { top: -3px; left: -3px; border-right: none; border-bottom: none; border-top-left-radius: 10px; }
  .scan-c.tr { top: -3px; right: -3px; border-left: none; border-bottom: none; border-top-right-radius: 10px; }
  .scan-c.bl { bottom: -3px; left: -3px; border-right: none; border-top: none; border-bottom-left-radius: 10px; }
  .scan-c.br { bottom: -3px; right: -3px; border-left: none; border-top: none; border-bottom-right-radius: 10px; }
  .scan-caption {
    margin-top: 26px; max-width: 300px; text-align: center;
    font-size: 14px; line-height: 1.5; color: var(--cast-on);
  }
  /* Inline status over the scanner (failed/ended states) — same status-row
     vocabulary, wrapped in a scrim pill so it reads over the dimmed feed. */
  .scan-pill {
    margin-top: 26px; max-width: 330px;
    background: color-mix(in srgb, var(--cast-background) 78%, transparent);
    border: 1px solid var(--chip-border); border-radius: 14px; padding: 10px 14px;
  }
  .scan-pill .status-row { margin-top: 0; font-size: 13px; }
  .torch {
    position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
    width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font: inherit; cursor: pointer;
    color: var(--cast-on);
    background: color-mix(in srgb, var(--cast-background) 55%, transparent);
    border: 1px solid color-mix(in srgb, var(--cast-on) 40%, transparent);
  }
  .torch[aria-pressed="true"] { background: var(--cast-on); color: var(--cast-background); border-color: var(--cast-on); }

  /* ---- Chips (selector vocabulary) ---- */
  .chip-row { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; padding-bottom: 2px; }
  .chip {
    flex: 0 0 auto;
    font: inherit; font-size: 14px;
    color: var(--cast-on);
    background: transparent;
    border: 1px solid var(--chip-border);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    background: var(--chip-selected-bg);
    border-color: var(--cast-primary);
    color: var(--cast-primary);
  }
  .chip:disabled { opacity: 0.45; cursor: default; }

  .slider-row { margin-top: 10px; }
  input[type="range"] { width: 100%; accent-color: var(--cast-primary); }
  .switch { position: relative; width: 48px; height: 28px; flex: 0 0 auto; }
  .switch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .switch .track {
    position: absolute; inset: 0; border-radius: 999px;
    background: color-mix(in srgb, var(--cast-on) 14%, var(--cast-surface));
    transition: background 0.15s;
  }
  .switch .thumb {
    position: absolute; top: 4px; left: 4px; width: 20px; height: 20px;
    border-radius: 50%; background: color-mix(in srgb, var(--cast-on) 92%, var(--cast-surface));
    transition: transform 0.15s;
  }
  .switch input:checked ~ .track { background: var(--cast-primary); }
  .switch input:checked ~ .thumb { transform: translateX(20px); background: #101418; }

  .chev { color: var(--cast-on-variant); display: flex; }

  /* ---- Read-only facts (console readout strip) ---- */
  .readout {
    margin-top: 10px; font-size: 12px; color: var(--cast-on-variant);
    background: color-mix(in srgb, var(--cast-on) 4%, var(--cast-surface));
    border-radius: 10px; padding: 10px 12px;
  }
  .readout strong { color: var(--cast-on); font-weight: 500; }

  /* ---- Reduced motion: spatial/attention loops off; fades stay ---- */
  @media (prefers-reduced-motion: reduce) {
    .scan-line { animation: none; }
    .led.pulse { animation: none; }
  }
</style>
</head>
<body>
  <div id="proto-controls" class="proto-controls"></div>

  <div class="phone">
    <div id="app"></div>
  </div>

<script>
"use strict";

/* ---- Data: every user-facing string is the app's real strings.xml text
   (the hero overline and live timer are new and noted in the file header);
   settings mirror CastSettings (CastSettingsCodec bumps to v4; each preset
   also carries the Advanced defaults). The control bar above the phone
   drives prototype states — it is never part of the ported design. ---- */
const DESKTOP_NAME = "Gaming PC";

const PROFILES = [
  { id: "cool",        name: "Cool",        intent: "Lowest heat — best for long sessions and warm devices." },
  { id: "balanced",    name: "Balanced",    intent: "The default — good for most games." },
  { id: "performance", name: "Performance", intent: "Smoother motion for fast games; more heat." },
  { id: "sharp",       name: "Sharp",       intent: "Highest detail; the most heat." },
];
const PROFILE_INTENT_CUSTOM = "Your own combination.";
const PROFILE_VALUES = {
  cool:        { longEdge: 960,  fps: 30, bitrateMin: 2, bitrateMax: 3,  encoder: "hardware", h264Profile: "baseline", degradation: "balanced",   fpsLimit: "off", bitrateMode: "vbr" },
  balanced:    { longEdge: 1280, fps: 30, bitrateMin: 4, bitrateMax: 6,  encoder: "hardware", h264Profile: "high",     degradation: "balanced",   fpsLimit: "off", bitrateMode: "cbr" },
  performance: { longEdge: 1280, fps: 60, bitrateMin: 6, bitrateMax: 10, encoder: "hardware", h264Profile: "high",     degradation: "framerate",  fpsLimit: "off", bitrateMode: "cbr" },
  sharp:       { longEdge: 1920, fps: 30, bitrateMin: 8, bitrateMax: 12, encoder: "hardware", h264Profile: "high",     degradation: "resolution", fpsLimit: "off", bitrateMode: "cbr" },
};

const PAIRING_ERRORS = {
  not_zfc: "This isn't a Zero-Friction Cast QR code.",
  unsupported_version: "The desktop app is newer or older than this app. Please update.",
  connect_unreachable: "Couldn't reach the desktop. Make sure both devices are on the same Wi-Fi network.",
  expired: "This QR code has expired. Generate a new one on the desktop.",
  bad_auth: "Couldn't pair with this desktop. Scan the QR code shown on the desktop.",
  busy: "The desktop is already connected to another device.",
  bad_version: "The desktop app is newer or older than this app. Please update.",
};

const MIC_DEVICE_OPTIONS = [
  { id: "builtin", name: "Phone mic" },
  { id: "wired",   name: "Headset mic" },
  { id: "usb",     name: "USB mic" },
  { id: "bt",      name: "Bluetooth mic" },
];
/* The live-routing lines are NEW app strings at port time:
   mic_records_from ("Records from %1$s" — mic on, not casting)
   mic_recording_from ("Recording from %1$s" — the live cast)
   mic_device_fallback_fact ("%1$s disconnected — switched to the phone mic.")
   and the settings_mic_device_* block moves to the Home screen with it. */

const THERMAL = {
  normal: "Phone temperature: normal.",
  light: "Phone is getting warm.",
  moderate: "Phone is hot. A cooler profile lowers the heat.",
  severe: "Phone is very hot. Consider stopping the cast until it cools.",
  critical: "Phone is overheating. Stop the cast and let it cool down.",
};
const ADAPTIVE = {
  down_thermal: "The phone got hot, so the quality was lowered to Balanced.",
  down_stream: "The stream struggled, so the quality was lowered to Balanced.",
  up: "The stream stayed healthy, so the quality went back up to Balanced.",
  restored: "Quality restored to Balanced.",
};

/* The app opens on the scan screen; Home is the connected hub.
   "Share screen" starts the cast; while casting it reads "Stop share screen"
   and only stops the video (the session stays connected). "Disconnect" ends
   everything. The gear opens all cast settings. */
const state = {
  screen: "scan",        // scan | home | settings
  scanState: "scanning", // permission | scanning | found | reconnecting | failed | ended
  scanFail: "connect_unreachable",
  torch: false, // flashlight while scanning (prototype toggles the button; the app drives CameraX's torch)
  homeState: "connected", // connected | starting | casting | failed
  // Audio & mic rows on Home. One switch per track. Only the microphone is
  // truly removed when off (its stream is torn down and the hardware is
  // freed for the game's own voice chat). Game audio off only mutes the
  // track — it stays part of the cast so the receiver's mixer row never
  // disappears.
  gameAudio: true, mic: false,
  // live-cast simulation ("This cast")
  thermal: "normal", adaptive: null, belowCeiling: false,
  // Mic device selection (#59, strings.xml mic_device_*): a KIND, not a
  // concrete device — offered only while one of its inputs is connected
  // (the app resolves the same way at capture time, MicDeviceResolver).
  micDevice: "builtin", // the chosen kind (the stored setting)
  micLiveDevice: "builtin", // what the live record is actually routed to
  micFallbackFact: null, // "…disconnected — switched to the phone mic."
  micInputs: ["builtin"], // connected kinds: builtin | wired | usb | bt
  // capture settings
  profile: "balanced", longEdge: 1280, fps: 30,
  bitrateAuto: true, bitrateMin: 4, bitrateMax: 6,
  autoQuality: true,
  advancedOpen: false,
  encoderImpl: "hardware", codec: "h264", h264Profile: "high",
  degradation: "balanced", fpsLimit: "off", bitrateMode: "cbr",
  // Read-only during a cast (SenderStats.encoderImplementation) — never faked.
  encoderInUse: null,
};

/* ---- DOM helpers ---- */

function icon(name, size) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>';
}

function chipRow(choices, pressedId, onPick, disabledId) {
  const row = el('<div class="chip-row"></div>');
  for (const c of choices) {
    const b = el('<button class="chip" type="button"></button>');
    b.textContent = c.name;
    b.setAttribute("aria-pressed", String(c.id === pressedId));
    if (c.id === disabledId) b.disabled = true;
    b.addEventListener("click", () => onPick(c.id));
    row.appendChild(b);
  }
  return row;
}

function switchEl(checked, onSet) {
  const sw = el('<label class="switch"><input type="checkbox"><span class="track"></span><span class="thumb"></span></label>');
  const box = sw.querySelector("input");
  box.checked = checked;
  box.addEventListener("change", () => onSet(box.checked));
  return sw;
}

function subLabel(text) { const d = el('<div class="sub-label"></div>'); d.textContent = text; return d; }
function hint(text) { const d = el('<div class="hint"></div>'); d.textContent = text; return d; }
function silkscreen(text) { const d = el('<div class="silkscreen"></div>'); d.textContent = text; return d; }

function textBtn(label, quiet, onClick) {
  const b = el('<button class="text-btn' + (quiet ? " quiet" : "") + '" type="button"></button>');
  b.textContent = label;
  b.addEventListener("click", onClick);
  return b;
}

function statusRow(kind, text) {
  const r = el('<div class="status-row ' + kind + '"></div>');
  const name = kind === "error" ? "warning" : (kind === "ok" ? "check" : "info");
  const holder = el('<span></span>'); holder.innerHTML = icon(name, 17);
  r.appendChild(holder.firstChild);
  const t = el('<span></span>'); t.textContent = text;
  r.appendChild(t);
  return r;
}
function spinnerEl(lg) { return el('<span class="spinner' + (lg ? " spinner-lg" : "") + '"></span>'); }
function spinnerRow(text, lg) {
  const r = el('<div class="spinner-row"></div>');
  r.appendChild(spinnerEl(lg));
  const t = el('<span></span>'); t.textContent = text; r.appendChild(t);
  return r;
}

function effectiveProfile() {
  const v = PROFILE_VALUES[state.profile];
  if (v && v.longEdge === state.longEdge && v.fps === state.fps && v.bitrateMin === state.bitrateMin && v.bitrateMax === state.bitrateMax) return state.profile;
  return "custom";
}

/* ---- Card / row builders ---- */
function card() { return el('<div class="card"></div>'); }

function iconRow(opts) {
  const r = el('<div class="icon-row"></div>');
  if (opts.id) r.setAttribute("data-od-id", opts.id);
  const ico = el('<div class="row-ico' + (opts.err ? " err" : "") + '"></div>');
  ico.innerHTML = icon(opts.ico, 19);
  r.appendChild(ico);
  const t = el('<div class="row-text"></div>');
  const tt = el('<div class="row-title' + (opts.err ? " err" : "") + '"></div>'); tt.textContent = opts.title; t.appendChild(tt);
  if (opts.sub) {
    const s = el('<div class="row-sub' + (opts.err ? " err" : "") + '"></div>'); s.textContent = opts.sub;
    t.appendChild(s);
  }
  r.appendChild(t);
  if (opts.right) { const rr = el('<div class="row-right"></div>'); rr.appendChild(opts.right); r.appendChild(rr); }
  if (opts.onClick) r.addEventListener("click", opts.onClick);
  return r;
}

/* LED + plain-words row ("This cast"): lamp classes map the platform
   ladder — normal=muted, warm/moderate=amber, severe+=error, and the
   adaptive announcements light while they apply. */
function ledRow(opts) {
  const r = el('<div class="led-row' + (opts.hot ? " hot" : "") + '"></div>');
  const led = el('<span class="led ' + (opts.led || "") + '"></span>');
  r.appendChild(led);
  const t = el('<div class="row-text"></div>');
  const tt = el('<div class="row-title"></div>'); tt.textContent = opts.title; t.appendChild(tt);
  r.appendChild(t);
  if (opts.right) { const rr = el('<div class="row-right"></div>'); rr.appendChild(opts.right); r.appendChild(rr); }
  return r;
}

function segLabel(text) { const d = el('<div class="seg-label"></div>'); d.textContent = text; return d; }

function segControl(choices, pressedId, onPick) {
  const seg = el('<div class="seg"></div>');
  for (const c of choices) {
    const b = el('<button class="seg-btn" type="button"></button>');
    b.textContent = c.name;
    b.setAttribute("aria-pressed", String(c.id === pressedId));
    b.addEventListener("click", () => onPick(c.id));
    seg.appendChild(b);
  }
  return seg;
}

/* The profile's real numbers (PROFILE_VALUES), shown as a tabular spec. */
function specOf(v) {
  return v.longEdge + " px · " + v.fps + " fps · " + v.bitrateMin + "–" + v.bitrateMax + " Mbps";
}
function pickRow(profile, spec, selected, onClick) {
  const r = el('<div class="pick-row' + (selected ? " pick-on" : "") + '"></div>');
  const radio = el('<span class="pick-radio"></span>');
  r.appendChild(radio);
  const t = el('<div class="row-text"></div>');
  const tt = el('<div class="row-title"></div>'); tt.textContent = profile.name;
  const s = el('<div class="row-sub"></div>'); s.textContent = profile.intent;
  t.appendChild(tt); t.appendChild(s);
  if (spec) {
    const sp = el('<div class="pick-spec mono"></div>'); sp.textContent = spec;
    t.appendChild(sp);
  }
  r.appendChild(t);
  if (onClick) r.addEventListener("click", onClick);
  return r;
}

/* Keep the live routing honest: a kind that is no longer connected cannot
   stay the routing target — fall back to the phone mic with a plain-words
   fact (the same resolver rule the capture side applies). */
function syncMicLive() {
  if (state.micLiveDevice !== "builtin" && !state.micInputs.includes(state.micLiveDevice)) {
    state.micFallbackFact = micOptionName(state.micLiveDevice) +
      " disconnected — switched to the phone mic.";
    state.micLiveDevice = "builtin";
  } else if (state.micLiveDevice === state.micDevice) {
    state.micFallbackFact = null;
  }
}
function micOptionName(id) {
  return MIC_DEVICE_OPTIONS.find((o) => o.id === id).name;
}

/* Auto-advancing transient states (pairing found, cast starting). */
let autoTimer = null;
function scheduleAuto(fn) {
  if (autoTimer) clearTimeout(autoTimer);
  autoTimer = setTimeout(fn, 1200);
}

/* ---- Live timer: ticks the hero's elapsed readout once a second without
   a re-render (keeps the tally pulse and sweep animations running). The
   app reads the cast-start timestamp from CastState.Casting — integration
   point; the prototype anchors it at the moment casting begins. ---- */
let castStart = null;
function fmtDuration(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  const p = (n) => String(n).padStart(2, "0");
  return h > 0 ? h + ":" + p(m) + ":" + p(s) : p(m) + ":" + p(s);
}
setInterval(() => {
  const node = document.querySelector('[data-od-id="home-live-timer"]');
  if (!node) {
    if (state.homeState !== "casting") castStart = null;
    return;
  }
  if (castStart === null) castStart = Date.now();
  node.textContent = fmtDuration(Math.floor((Date.now() - castStart) / 1000));
}, 1000);

/* ---- Scan (the launch screen: pair with the desktop) ---- */
/* Telegram/WhatsApp-style scanner: full-bleed camera area, dimmed scrim with
   a rounded-square cutout, corner brackets, animated scan line, caption, torch.
   status = null while scanning, or {kind, text} for the failed/ended overlays. */
function scanBlock(status) {
  const b = el('<div class="scan-full" data-od-id="scan-scanner"></div>');
  const title = el('<div class="scan-title"></div>');
  title.textContent = "Scan the desktop's QR code";
  b.appendChild(title);

  const stage = el('<div class="scan-stage"></div>');
  const cutout = el('<div class="scan-cutout" data-od-id="scan-cutout"></div>');
  const ph = el('<div class="scan-placeholder"></div>');
  ph.textContent = "Camera preview"; // placeholder — the app renders the live feed here
  cutout.appendChild(ph);
  cutout.appendChild(el('<div class="scan-line"></div>'));
  stage.appendChild(cutout);
  for (const pos of ["tl", "tr", "bl", "br"]) {
    stage.appendChild(el('<span class="scan-c ' + pos + '"></span>'));
  }
  b.appendChild(stage);

  if (status) {
    const pill = el('<div class="scan-pill"></div>');
    pill.appendChild(statusRow(status.kind, status.text));
    b.appendChild(pill);
  } else {
    const cap = el('<div class="scan-caption" data-od-id="scan-caption"></div>');
    cap.textContent = "Point the camera at the QR code shown on the desktop app.";
    b.appendChild(cap);
  }

  const torch = el('<button class="torch" type="button" data-od-id="scan-torch" aria-label="Flashlight"></button>');
  torch.innerHTML = icon("flashlight", 22);
  torch.setAttribute("aria-pressed", String(state.torch));
  torch.addEventListener("click", () => {
    state.torch = !state.torch;
    torch.setAttribute("aria-pressed", String(state.torch)); // local update only — keeps the sweep animation running
  });
  b.appendChild(torch);
  return b;
}

function renderScan(parent) {
  const root = el('<div></div>');

  if (state.scanState === "permission") {
    // Pre-camera state: QR glyph + title + the grant action, centered.
    const wrap = el('<div class="scan-perm"></div>');
    const glyph = el('<div class="scan-perm-ico"></div>');
    glyph.innerHTML = icon("qr", 40);
    glyph.style.color = "var(--cast-on-variant)";
    wrap.appendChild(glyph);
    const title = el('<div class="screen-title"></div>'); title.textContent = "Scan the desktop's QR code";
    title.style.textAlign = "center";
    wrap.appendChild(title);
    const h = hint("Camera access is needed to scan the QR code.");
    h.style.textAlign = "center"; h.style.marginTop = "10px";
    wrap.appendChild(h);
    const btn = el('<button class="btn-mid" type="button"></button>');
    btn.textContent = "Grant camera access";
    btn.style.marginTop = "16px";
    btn.addEventListener("click", () => { state.scanState = "scanning"; renderAll(); });
    wrap.appendChild(btn);
    wrap.style.cssText = "display:flex;flex-direction:column;align-items:center;justify-content:center;height:560px;padding:0 12px;";
    root.appendChild(wrap);
  } else if (state.scanState === "scanning") {
    root.appendChild(scanBlock(null));
  } else if (state.scanState === "found") {
    const wrap = el('<div></div>');
    wrap.style.cssText = "display:flex;flex-direction:column;align-items:center;justify-content:center;height:560px;padding:0 24px;";
    const glyph = el('<div></div>'); glyph.innerHTML = icon("check", 40);
    glyph.style.color = "var(--cast-primary)";
    glyph.style.marginBottom = "14px";
    wrap.appendChild(glyph);
    const t = el('<div class="screen-title"></div>'); t.textContent = "Desktop found";
    t.style.textAlign = "center";
    wrap.appendChild(t);
    const r = spinnerRow("Pairing with the desktop…", true); r.style.marginTop = "14px";
    wrap.appendChild(r);
    root.appendChild(wrap);
    scheduleAuto(() => { state.screen = "home"; state.homeState = "connected"; renderAll(); });
  } else if (state.scanState === "reconnecting") {
    const wrap = el('<div></div>');
    wrap.style.cssText = "display:flex;flex-direction:column;align-items:center;justify-content:center;height:560px;padding:0 24px;";
    const r = spinnerRow("Reconnecting to the desktop…", true);
    wrap.appendChild(r);
    root.appendChild(wrap);
    scheduleAuto(() => { state.screen = "home"; state.homeState = "connected"; renderAll(); });
  } else if (state.scanState === "failed") {
    root.appendChild(scanBlock({ kind: "error", text: PAIRING_ERRORS[state.scanFail] }));
  } else if (state.scanState === "ended") {
    root.appendChild(scanBlock({ kind: "info", text: "The desktop ended the session. Scan again to connect." }));
  }
  parent.appendChild(root);
}

/* ---- Home (the connected hub) ---- */
function renderHome(parent) {
  const root = el('<div></div>');
  const casting = state.homeState === "casting";

  // App bar: product name + the gear (all cast settings)
  const bar = el('<div class="app-bar"></div>');
  const bt = el('<div class="bar-title"></div>'); bt.textContent = "Zero-Friction Local Cast";
  bar.appendChild(bt);
  const gear = el('<button class="icon-btn" type="button" aria-label="Cast settings"></button>');
  gear.innerHTML = icon("gear", 19);
  gear.addEventListener("click", () => { state.screen = "settings"; renderAll(); });
  bar.appendChild(gear);
  root.appendChild(bar);

  // On-air hero — the tally section. Connected = steady lamp; casting =
  // pulsing lamp + the live elapsed readout. (New strings noted in header.)
  if (state.homeState === "failed") {
    const err = card();
    err.setAttribute("data-od-id", "home-connection");
    err.appendChild(iconRow({ ico: "warning", title: "Couldn't start the cast. Please try again.", err: true }));
    root.appendChild(err);
  } else {
    const hero = el('<div class="hero" data-od-id="home-hero"></div>');
    const left = el('<div class="hero-left"></div>');
    const overline = el('<div class="hero-overline"></div>');
    const led = el('<span class="led on' + (casting ? " pulse" : "") + '"></span>');
    const ov = el('<span></span>');
    ov.textContent = casting ? "Casting to" : "Connected to";
    overline.appendChild(led); overline.appendChild(ov);
    left.appendChild(overline);
    const name = el('<div class="hero-name"></div>'); name.textContent = DESKTOP_NAME;
    left.appendChild(name);
    if (casting) {
      const meta = el('<div class="hero-meta mono" data-od-id="home-live-timer">00:00</div>');
      left.appendChild(meta);
    }
    hero.appendChild(left);
    // Disconnect ends everything: the session too. Back to the scan screen.
    hero.appendChild(textBtn("Disconnect", true, () => { state.screen = "scan"; state.scanState = "scanning"; renderAll(); }));
    root.appendChild(hero);
  }

  // The transport control: solid amber to go, outlined to stop the video
  // (the pairing session stays connected — only the video stops).
  if (state.homeState === "starting") {
    const r = spinnerRow("Starting the cast…"); r.style.marginTop = "18px"; root.appendChild(r);
    // mobile.md consent affordance (Android 14+): the system dialog shown
    // during this window defaults to the cast-killing choice.
    const h = hint("When your phone asks what to share, choose “Share full screen”.");
    h.style.marginTop = "10px";
    root.appendChild(h);
  } else {
    const go = el('<button class="' + (casting ? "btn-stop" : "btn-go") + '" type="button" data-od-id="home-share"></button>');
    go.textContent = casting ? "Stop share screen" : "Share screen";
    go.addEventListener("click", () => {
      if (casting) { state.homeState = "connected"; renderAll(); return; }
      state.homeState = "starting"; renderAll();
      scheduleAuto(() => { if (state.homeState === "starting") { state.homeState = "casting"; renderAll(); } });
    });
    root.appendChild(go);
  }

  // Audio card — one switch per track
  const audioLabel = silkscreen("Audio");
  root.appendChild(audioLabel);
  const audio = card();
  audio.setAttribute("data-od-id", "home-audio");
  audio.appendChild(iconRow({
    ico: "gamepad", title: "Game audio",
    sub: "Off silences the game audio, but its track stays part of the cast.",
    right: switchEl(state.gameAudio, (on) => { state.gameAudio = on; renderAll(); }),
  }));
  // The mic row's sub is the ROUTING FACT: which device records right now
  // (live while casting) or will record (the default when off/next start).
  // With the mic on, the connected kinds sit under the row — picking one
  // reroutes the live record instantly; an unplugged kind falls back to the
  // phone mic with a plain-words fact. (New strings, port-time note:
  // mic_records_from / mic_recording_from / mic_device_fallback_fact.)
  const micName = (id) => MIC_DEVICE_OPTIONS.find((o) => o.id === id).name;
  const micSub = !state.mic
    ? "Off removes the microphone from the cast and frees it for the game's own voice chat."
    : (casting ? "Recording from " : "Records from ") + micName(state.micLiveDevice);
  audio.appendChild(iconRow({
    ico: "mic", title: "Microphone",
    sub: micSub,
    id: "home-mic-row",
    right: switchEl(state.mic, (on) => { state.mic = on; syncMicLive(); renderAll(); }),
  }));
  if (state.mic) {
    const micSub1 = el('<div class="mic-sub"></div>');
    micSub1.appendChild(chipRow(
      MIC_DEVICE_OPTIONS.filter((o) => state.micInputs.includes(o.id)),
      state.micLiveDevice,
      (id) => {
        state.micDevice = id;
        state.micLiveDevice = id; // live reroute — no session rebuild
        state.micFallbackFact = null;
        renderAll();
      },
    ));
    if (state.micFallbackFact) {
      const fact = el('<div class="hint"></div>');
      fact.textContent = state.micFallbackFact;
      micSub1.appendChild(fact);
    }
    audio.appendChild(micSub1);
  }
  root.appendChild(audio);

  // This cast (live conditions) — only while casting
  if (casting) {
    root.appendChild(silkscreen("This cast"));
    const cast = card();
    cast.setAttribute("data-od-id", "home-this-cast");
    if (state.mic && state.gameAudio) {
      cast.appendChild(iconRow({ ico: "headphones", title: "Tip: use headphones — otherwise the mic picks up the game audio playing from this phone." }));
    }
    const hot = state.thermal === "severe" || state.thermal === "critical";
    cast.appendChild(ledRow({
      title: THERMAL[state.thermal],
      led: hot ? "hot" : (state.thermal === "normal" ? "" : "on"),
      hot,
    }));
    if (state.adaptive) {
      const downshift = state.adaptive === "down_thermal" || state.adaptive === "down_stream";
      cast.appendChild(ledRow({
        title: ADAPTIVE[state.adaptive],
        led: downshift ? "on" : "",
        right: state.belowCeiling
          ? textBtn("Restore quality", false, () => { state.adaptive = "restored"; state.belowCeiling = false; renderAll(); })
          : null,
      }));
    }
    root.appendChild(cast);
  }
  parent.appendChild(root);
}

/* ---- Settings (the gear: all cast settings) ---- */
function renderSettings(parent) {
  const root = el('<div></div>');
  const bar = el('<div class="app-bar"></div>');
  const back = el('<button class="icon-btn" type="button" aria-label="Back"></button>');
  back.innerHTML = icon("chevLeft", 20);
  back.style.marginLeft = "-8px";
  back.addEventListener("click", () => { state.screen = "home"; renderAll(); });
  bar.appendChild(back);
  const bt = el('<div class="bar-title"></div>'); bt.textContent = "Cast settings";
  bar.appendChild(bt);
  root.appendChild(bar);
  const sub = el('<div class="bar-sub"></div>');
  sub.textContent = "Changes take effect on the next cast.";
  root.appendChild(sub);

  // Quality card — profile, resolution, frame rate, bitrate, adaptive
  root.appendChild(silkscreen("Share screen"));
  const q = card();
  q.setAttribute("data-od-id", "settings-quality");
  const eff = effectiveProfile();
  for (const p of PROFILES) {
    q.appendChild(pickRow(p, specOf(PROFILE_VALUES[p.id]), eff === p.id, () => {
      const v = PROFILE_VALUES[p.id];
      Object.assign(state, {
        profile: p.id, longEdge: v.longEdge, fps: v.fps,
        bitrateAuto: true, bitrateMin: v.bitrateMin, bitrateMax: v.bitrateMax,
        // Presets also reset the Advanced defaults (overridable afterwards):
        encoderImpl: v.encoder, h264Profile: v.h264Profile, degradation: v.degradation,
        fpsLimit: v.fpsLimit, bitrateMode: v.bitrateMode,
      });
      renderAll();
    }));
  }
  if (eff === "custom") {
    q.appendChild(pickRow({ name: "Custom", intent: PROFILE_INTENT_CUSTOM }, null, true, null));
  }

  q.appendChild(segLabel("Resolution (long edge)"));
  q.appendChild(segControl(
    [960, 1280, 1920].map((v) => ({ id: String(v), name: v + " px" })),
    String(state.longEdge),
    (id) => { state.longEdge = Number(id); renderAll(); },
  ));
  q.appendChild(segLabel("Frame rate"));
  q.appendChild(segControl(
    [30, 60].map((v) => ({ id: String(v), name: v + " fps" })),
    String(state.fps),
    (id) => { state.fps = Number(id); renderAll(); },
  ));

  q.appendChild(segLabel("Bitrate"));
  q.appendChild(iconRow({
    ico: "tune", title: "Automatic (follows the profile)",
    right: switchEl(state.bitrateAuto, (on) => {
      if (on) { const v = PROFILE_VALUES[state.profile]; Object.assign(state, { bitrateAuto: true, bitrateMin: v.bitrateMin, bitrateMax: v.bitrateMax }); }
      else { state.bitrateAuto = false; state.bitrateMin = Math.round((state.bitrateMax * 0.5) * 10) / 10; }
      renderAll();
    }),
  }));
  if (!state.bitrateAuto) {
    const wrap = el('<div class="adv-body slider-row"></div>');
    const range = el('<input type="range" min="2" max="20" step="0.5">');
    range.value = String(state.bitrateMax);
    const note = el('<div class="hint"></div>');
    note.textContent = "Max " + state.bitrateMax + " Mbps";
    range.addEventListener("input", () => {
      state.bitrateMax = Number(range.value);
      state.bitrateMin = Math.round((state.bitrateMax * 0.5) * 10) / 10;
      note.textContent = "Max " + state.bitrateMax + " Mbps";
    });
    wrap.appendChild(range); wrap.appendChild(note);
    q.appendChild(wrap);
  }
  q.appendChild(iconRow({
    ico: "check", title: "Automatic quality",
    sub: "Lowers the quality on its own when the phone gets hot or the stream struggles.",
    right: switchEl(state.autoQuality, (on) => { state.autoQuality = on; renderAll(); }),
  }));
  const foot = el('<div class="card-foot"></div>');
  foot.textContent = "Picking a template also sets the Advanced defaults below — you can still override them.";
  q.appendChild(foot);
  root.appendChild(q);

  // Advanced card — collapsed by default; the header row is the toggle
  root.appendChild(silkscreen("Advanced"));
  const adv = card();
  adv.setAttribute("data-od-id", "settings-advanced");
  const chev = el('<span class="chev"></span>');
  chev.innerHTML = icon(state.advancedOpen ? "chevDown" : "chevRight", 18);
  adv.appendChild(iconRow({
    ico: "tune", title: "Advanced", right: chev,
    onClick: () => { state.advancedOpen = !state.advancedOpen; renderAll(); },
  }));
  if (state.advancedOpen) {
    const body = el('<div class="adv-body"></div>');
    appendAdvancedContent(body);
    adv.appendChild(body);
  }
  root.appendChild(adv);
  parent.appendChild(root);
}

function appendAdvancedContent(content) {
  content.appendChild(subLabel("Encoder"));
  content.appendChild(chipRow(
    [
      { id: "hardware", name: "Hardware" },
      { id: "software", name: "Software" },
    ],
    state.encoderImpl,
    (id) => { state.encoderImpl = id; renderAll(); },
  ));
  content.appendChild(hint(
    state.encoderImpl === "hardware"
      ? "Hardware encoding is the most efficient for the phone's heat. On some phones it can compete with a game for the chip — if a game stutters while casting, try Software."
      : "Software encoding frees the phone's video hardware (more CPU used by the cast, less contention with the game). It runs hotter on the CPU, so watch the thermal status.",
  ));

  content.appendChild(subLabel("Preferred video codec"));
  content.appendChild(chipRow(
    [
      { id: "h264", name: "H.264" },
      { id: "vp8", name: "VP8" },
    ],
    state.codec,
    (id) => { state.codec = id; renderAll(); },
  ));

  content.appendChild(subLabel("H.264 profile"));
  const profileRow = chipRow(
    [
      { id: "baseline", name: "Baseline" },
      { id: "high", name: "High" },
    ],
    state.h264Profile,
    (id) => { state.h264Profile = id; renderAll(); },
    state.codec === "vp8" ? "both" : null,
  );
  content.appendChild(profileRow);
  if (state.codec === "vp8") {
    for (const b of profileRow.querySelectorAll(".chip")) b.disabled = true;
    content.appendChild(hint("Profile applies to H.264 only."));
  }

  content.appendChild(subLabel("Under network pressure"));
  content.appendChild(chipRow(
    [
      { id: "balanced", name: "Balanced" },
      { id: "framerate", name: "Keep frame rate" },
      { id: "resolution", name: "Keep resolution" },
    ],
    state.degradation,
    (id) => { state.degradation = id; renderAll(); },
  ));
  content.appendChild(hint("What the cast gives up first when Wi-Fi slows down. Balanced trades a little of both; \"Keep frame rate\" stays smooth and drops detail; \"Keep resolution\" stays sharp and drops frames."));

  content.appendChild(subLabel("Encoder fps limit"));
  content.appendChild(chipRow(
    [
      { id: "off", name: "Off" },
      { id: "15", name: "15 fps" },
      { id: "30", name: "30 fps" },
      { id: "60", name: "60 fps" },
    ],
    String(state.fpsLimit),
    (id) => { state.fpsLimit = id === "off" ? "off" : id; renderAll(); },
  ));
  content.appendChild(hint("Caps how many frames per second the encoder works on. The effective rate is the lower of this and the capture frame rate — e.g. capture 60 fps with a 30 fps limit encodes 30. Off follows the capture frame rate."));

  content.appendChild(subLabel("Bitrate mode"));
  content.appendChild(chipRow(
    [
      { id: "cbr", name: "CBR" },
      { id: "vbr", name: "VBR" },
    ],
    state.bitrateMode,
    (id) => { state.bitrateMode = id; renderAll(); },
  ));
  content.appendChild(hint("CBR keeps the output bitrate constant — the encoder works at full effort on every frame (today's behavior). VBR spends fewer bits on easy frames, so the encoder's average load is lower."));

  // Read-only: the encoder libwebrtc actually picked for the active cast.
  // Real value comes from getStats (SenderStats.encoderImplementation) — shown
  // only when known, never faked.
  const readout = el('<div class="readout mono"></div>');
  readout.textContent = "Encoder in use: — (visible during a cast)";
  if (state.encoderInUse) {
    const strong = el("<strong></strong>"); strong.textContent = state.encoderInUse;
    readout.replaceChildren("Encoder in use: ", strong);
  }
  content.appendChild(readout);
  content.appendChild(hint("Advanced settings — the defaults reproduce today's cast. Overrides here do not change which template chip is selected. Everything takes effect on the next cast."));
}

/* ---- Prototype-only control bar ---- */
function pbtn(label, pressed, onClick) {
  const b = el('<button class="pbtn" type="button"></button>');
  b.textContent = label;
  b.setAttribute("aria-pressed", String(pressed));
  b.addEventListener("click", onClick);
  return b;
}
function protoLabel(t) { const s = el('<span class="proto-label"></span>'); s.textContent = t; return s; }

function renderControls() {
  const c = document.getElementById("proto-controls");
  c.replaceChildren();
  c.appendChild(protoLabel("Screen:"));
  for (const s of ["scan", "home", "settings"]) {
    c.appendChild(pbtn(s, state.screen === s, () => { state.screen = s; renderAll(); }));
  }
  if (state.screen === "scan") {
    c.appendChild(protoLabel("Scan state:"));
    for (const s of ["permission", "scanning", "found", "reconnecting", "failed", "ended"]) {
      c.appendChild(pbtn(s, state.scanState === s, () => { state.scanState = s; renderAll(); }));
    }
    if (state.scanState === "failed") {
      c.appendChild(protoLabel("Error:"));
      for (const k of Object.keys(PAIRING_ERRORS)) {
        c.appendChild(pbtn(k, state.scanFail === k, () => { state.scanFail = k; renderAll(); }));
      }
    }
  } else if (state.screen === "home") {
    c.appendChild(protoLabel("Home state:"));
    for (const s of ["connected", "starting", "casting", "failed"]) {
      c.appendChild(pbtn(s, state.homeState === s, () => { state.homeState = s; renderAll(); }));
    }
    c.appendChild(protoLabel("Mic inputs:"));
    const combos = [
      ["phone", ["builtin"]],
      ["phone+wired", ["builtin", "wired"]],
      ["phone+usb", ["builtin", "usb"]],
      ["phone+bt", ["builtin", "bt"]],
      ["all", ["builtin", "wired", "usb", "bt"]],
    ];
    for (const [label, inputs] of combos) {
      c.appendChild(pbtn(label, state.micInputs.join(",") === inputs.join(","), () => {
        state.micInputs = inputs;
        syncMicLive(); // an unplug while recording is the fallback case
        renderAll();
      }));
    }
    if (state.homeState === "casting") {
      c.appendChild(protoLabel("Thermal:"));
      for (const k of Object.keys(THERMAL)) {
        c.appendChild(pbtn(k, state.thermal === k, () => { state.thermal = k; renderAll(); }));
      }
      c.appendChild(protoLabel("Quality:"));
      const options = [["none", null], ["down_thermal", "down_thermal"], ["down_stream", "down_stream"], ["up", "up"]];
      for (const [label, v] of options) {
        c.appendChild(pbtn(label, state.adaptive === v, () => {
          state.adaptive = v;
          state.belowCeiling = v === "down_thermal" || v === "down_stream";
          renderAll();
        }));
      }
    }
  }
}

function renderAll() {
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  renderControls();
  const app = document.getElementById("app");
  app.replaceChildren();
  if (state.screen === "scan") renderScan(app);
  else if (state.screen === "home") renderHome(app);
  else renderSettings(app);
}

renderAll();
</script>
</body>
</html>
